<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUMIIA · Agenda</title>
<style>body{background:#0b0a1f;color:#9b97c8;font-family:system-ui,sans-serif;display:grid;place-items:center;height:100vh;margin:0}</style>
<script>
/* Routage GitHub Pages :
   /agenda-artistes/admin  -> espace organisateur
   /agenda-artistes/0902   -> accès DJ avec le code 0902
   tout le reste           -> page d'accueil (saisie / QR) */
(function(){
  var base = "/agenda-artistes/";
  var parts = location.pathname.split("/").filter(Boolean);
  var seg = parts.length ? parts[parts.length-1] : "";
  if(seg === "admin"){ location.replace(base + "?admin"); }
  else if(seg && seg !== "agenda-artistes"){ location.replace(base + "?code=" + encodeURIComponent(seg)); }
  else { location.replace(base); }
})();
</script>
</head><body>Redirection…</body></html>
