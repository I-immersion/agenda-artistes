<style>
  :root{
    --bg:#0b0a1f; --bg2:#13112e; --card:#1a1840; --card2:#211f4d;
    --ink:#eae8ff; --muted:#9b97c8; --line:#2e2b5e;
    --violet:#8b5cf6; --cyan:#22d3ee; --green:#34d399; --red:#fb7185; --amber:#fbbf24;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(1200px 600px at 80% -10%,#241f5a 0%,transparent 55%),
               radial-gradient(900px 500px at -10% 10%,#1b2a52 0%,transparent 50%),var(--bg);
    color:var(--ink);min-height:100vh;padding:0 0 90px}
  header{position:sticky;top:0;z-index:20;background:rgba(11,10,31,.82);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);padding:14px 16px}
  .bar{display:flex;align-items:center;gap:12px;max-width:820px;margin:0 auto}
  .logo{width:34px;height:34px;flex:0 0 auto;border-radius:9px}
  h1{font-size:1.05rem;margin:0;line-height:1.1;letter-spacing:.3px}
  h1 small{display:block;font-size:.72rem;color:var(--muted);font-weight:400;letter-spacing:.4px}
  .ver{color:var(--violet);font-weight:600}
  .conn{display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--muted);margin-left:auto;white-space:nowrap}
  .conn .dotc{width:9px;height:9px;border-radius:50%;background:var(--muted);transition:.3s}
  .conn.ok .dotc{background:var(--green);box-shadow:0 0 8px rgba(52,211,153,.85)}
  .conn.off .dotc{background:var(--red);box-shadow:0 0 8px rgba(251,113,133,.7)}
  .gear{background:var(--card);border:1px solid var(--line);color:var(--muted);
    width:38px;height:38px;border-radius:10px;font-size:1.1rem;cursor:pointer;display:grid;place-items:center}
  .gear.on{color:var(--cyan);border-color:var(--cyan)}
  main{max-width:820px;margin:0 auto;padding:16px}

  .whois{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
  .whois label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:8px;letter-spacing:.4px;text-transform:uppercase}
  .whois select{width:100%;background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:13px 12px;font-size:1.05rem;font-weight:600}
  .whois .hint{margin-top:8px;font-size:.8rem;color:var(--muted)}

  .legend{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:4px 0 16px;font-size:.8rem;color:var(--muted)}
  .legend span{display:flex;align-items:center;gap:7px}
  .sw{width:14px;height:14px;border-radius:4px;border:1px solid}
  .sw.free{background:rgba(52,211,153,.2);border-color:var(--green)}
  .sw.taken{background:rgba(251,113,133,.18);border-color:var(--red)}
  .sw.mine{background:rgba(251,191,36,.24);border-color:var(--amber)}

  /* Calendrier */
  .cal{margin-bottom:24px}
  .cal h2{font-size:1.2rem;margin:0 0 10px 2px;text-transform:capitalize}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .dow{font-size:.62rem;color:var(--muted);text-align:center;padding-bottom:3px;text-transform:uppercase;letter-spacing:.3px}
  .cell{min-height:56px;border-radius:10px;padding:5px 4px;display:flex;flex-direction:column;gap:2px;
    background:var(--bg2);border:1px solid transparent;transition:.12s;overflow:hidden;position:relative}
  .cell.blank{background:transparent}
  .cell .num{font-size:.74rem;font-weight:700;color:var(--muted)}
  .cell.day .num{color:var(--ink)}
  .cell.free{background:rgba(52,211,153,.16);border-color:rgba(52,211,153,.5);cursor:pointer}
  .cell.free .num{color:var(--green)}
  .cell.free:hover{background:rgba(52,211,153,.28)}
  .cell.taken{background:rgba(251,113,133,.14);border-color:rgba(251,113,133,.45)}
  .cell.taken .num{color:var(--red)}
  .cell.mine{background:rgba(251,191,36,.24);border:1px solid var(--amber);cursor:pointer}
  .cell.mine .num{color:var(--amber)}
  .cell.closed{background:var(--bg2);border:1px dashed var(--line);cursor:pointer}
  .cell.closed:hover{border-color:var(--violet)}
  .cell .tag{font-size:.58rem;line-height:1.05;font-weight:700;margin-top:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cell .tag.g{color:var(--green)} .cell .tag.r{color:var(--red)} .cell .tag.m{color:var(--amber)} .cell .tag.x{color:var(--muted)}
  .cell .memo{position:absolute;top:2px;right:3px;font-size:.62rem;line-height:1;filter:saturate(1.3)}

  .empty{text-align:center;color:var(--muted);padding:48px 20px;font-size:.95rem;line-height:1.5}
  .empty .big{font-size:2rem;margin-bottom:10px}

  /* Login + Admin */
  .login{background:var(--card);border:1px solid var(--cyan);border-radius:14px;padding:18px;max-width:380px;margin:10px auto}
  .login h3{margin:0 0 4px;font-size:1rem;color:var(--cyan)}
  .login p{margin:0 0 14px;font-size:.82rem;color:var(--muted)}
  .login input{width:100%;background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:1rem;margin-bottom:10px}
  .login button{width:100%;background:var(--violet);color:#fff;border:0;border-radius:10px;padding:13px;font-weight:700;cursor:pointer;font-size:1rem}
  .login .err{color:var(--red);font-size:.82rem;margin-top:8px;min-height:1em}

  .adminbar{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:.85rem}
  .adminbar .who{flex:1;color:var(--cyan);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .adminbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:18px}
  .adminbox h3{margin:0 0 12px;font-size:.95rem;color:var(--cyan)}
  .djrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .djrow:last-child{border-bottom:0}
  .djrow .nm{flex:1;font-weight:600}
  .djrow .drag{cursor:grab;color:var(--muted);font-size:1.1rem;user-select:none;touch-action:none}
  .djrow.dragging{opacity:.4}
  .djrow.over{background:var(--card2);box-shadow:inset 0 2px 0 var(--cyan)}
  .djrow button.mv{padding:6px 10px;font-size:.9rem;line-height:1}
  .djrow button.mv:disabled{opacity:.3;cursor:default}
  .djrow input.codeinput{width:88px;background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:.85rem}
  .gate input{width:100%;background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:1.1rem;text-align:center;margin-bottom:10px}
  .gate #codeGo{width:100%;background:var(--violet);color:#fff;border:0;border-radius:12px;padding:14px;font-weight:800;font-size:1rem;cursor:pointer}
  .gateerr{color:var(--red);font-size:.85rem;margin-top:10px;min-height:1em}
  .addrow{display:flex;gap:8px;margin-top:12px}
  .addrow input{flex:1;background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:1rem}
  button.act{background:var(--violet);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:7px 12px;cursor:pointer;font-size:.82rem}
  button.danger{color:var(--red);border-color:rgba(251,113,133,.4)}
  .note{font-size:.8rem;color:var(--muted);margin:0 2px 12px;line-height:1.4}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(40px);
    background:var(--card2);border:1px solid var(--cyan);color:var(--ink);padding:12px 20px;border-radius:12px;
    font-weight:600;opacity:0;transition:.25s;z-index:60;box-shadow:0 10px 40px rgba(0,0,0,.5);max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .loading{text-align:center;color:var(--muted);padding:60px 0}

  /* Fiche technique DJ (v3.5) */
  label.fl{display:block;font-size:.85rem;color:var(--muted);margin:12px 0 0;font-weight:600}
  label.fl input, label.fl textarea, .fl input, .fl textarea{display:block;width:100%;margin-top:6px;background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:.95rem;font-family:inherit}
  label.fl textarea{min-height:64px;resize:vertical}
  label.fl input:disabled{opacity:.4}
  .fl{font-size:.85rem;color:var(--muted);margin-top:14px;font-weight:600}
  label.ck{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;color:var(--ink);cursor:pointer;line-height:1.35}
  label.ck input{margin-top:2px;width:18px;height:18px;flex:0 0 auto;accent-color:var(--cyan)}
  .pills{display:inline-flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .pills .pill{background:var(--bg2);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:.9rem;font-weight:700;cursor:pointer}
  .pills .pill.on{background:rgba(34,211,238,.16);color:var(--cyan);border-color:var(--cyan)}
  .hint2{font-size:.72rem;color:var(--muted);font-weight:400}
  textarea.bigobs{min-height:150px}
  .uploadbtn{display:inline-block;margin-top:10px;background:var(--card2);color:var(--cyan);border:1px solid var(--cyan);border-radius:11px;padding:12px 16px;font-weight:700;cursor:pointer;font-size:.92rem}
  .filelist{display:flex;flex-direction:column;gap:8px;margin:8px 0}
  .filelist{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin:8px 0}
  .filecard{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg2)}
  .filecard .thumb{display:flex;align-items:center;justify-content:center;aspect-ratio:1;background:#0b0a1f;text-decoration:none}
  .filecard .thumb img{width:100%;height:100%;object-fit:cover}
  .filecard .thumb .fileic{font-size:2rem}
  .filecard .fnm{font-size:.64rem;color:var(--ink);padding:4px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .filecard .fdl{position:absolute;top:3px;left:3px;background:rgba(11,10,31,.75);border-radius:6px;padding:1px 4px;font-size:.8rem;text-decoration:none}
  .filecard .fdel{position:absolute;top:3px;right:3px;background:rgba(251,113,133,.9);color:#fff;border:0;border-radius:6px;width:20px;height:20px;font-size:.75rem;cursor:pointer;line-height:1}
  /* Observations + détails de dates (v2.1) */
  .obsgen{background:var(--card);border:1px solid var(--amber);border-radius:12px;padding:12px 14px;margin-bottom:14px}
  .obsgen .lbl{font-size:.72rem;color:var(--amber);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
  .obsgen .txt{font-size:.9rem;color:var(--ink);white-space:pre-wrap;line-height:1.4}
  textarea.obs{width:100%;background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:.88rem;font-family:inherit;resize:vertical;min-height:42px}
  .daterow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:11px 0;border-bottom:1px solid var(--line)}
  .daterow:last-child{border-bottom:0}
  .daterow .dd{font-weight:700;font-size:.92rem;flex:1;min-width:140px;text-transform:capitalize}
  .daterow .dd small{display:block;font-weight:400;font-size:.76rem;color:var(--muted)}
  .daterow .who2{font-size:.8rem;color:var(--cyan);font-weight:600}
  .daterow .who2.libre{color:var(--green)}
  .daterow select.assign{background:var(--bg2);color:var(--ink);border:1px solid var(--cyan);border-radius:9px;padding:9px 10px;font-size:.9rem;font-weight:600;min-width:130px}
  .daterow .chips{display:flex;flex-wrap:wrap;gap:6px}
  .daterow .chip{display:inline-flex;align-items:center;gap:6px;background:rgba(251,191,36,.18);border:1px solid var(--amber);color:var(--ink);border-radius:999px;padding:4px 6px 4px 11px;font-size:.82rem;font-weight:600}
  .daterow .chip .chipx{background:none;border:0;color:var(--red);cursor:pointer;font-size:.85rem;padding:0 2px;line-height:1}
  .daterow textarea.obs{flex-basis:100%}
  .sendbar{position:sticky;bottom:0;margin:22px -16px -90px;padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg,var(--bg) 60%,transparent);}
  .btn-send{width:100%;max-width:520px;margin:0 auto;display:block;background:var(--violet);color:#fff;border:0;
    border-radius:12px;padding:15px;font-size:1rem;font-weight:800;cursor:pointer;box-shadow:0 6px 24px rgba(139,92,246,.4)}
  .btn-send:disabled{opacity:.4;cursor:default;box-shadow:none}
  .sectit{font-size:.95rem;margin:20px 2px 8px;color:var(--ink);font-weight:700}
  .qrbox{background:#fff;border-radius:14px;padding:16px;max-width:260px;margin:6px auto 4px;text-align:center}
  .qrbox img{width:100%;height:auto;display:block}
  .qrcap{text-align:center;font-size:.82rem;color:var(--muted);margin:0 0 6px;word-break:break-all}
  .qrcap a{color:var(--cyan);text-decoration:none}

  /* Écran d'identité (v2.2) */
  .gate{max-width:420px;margin:30px auto;text-align:center}
  .gate h2{font-size:1.3rem;margin:0 0 6px}
  .gate p{color:var(--muted);font-size:.9rem;margin:0 0 20px}
  .gate .names{display:flex;flex-direction:column;gap:10px}
  .gate .names button{background:var(--card);border:1px solid var(--line);color:var(--ink);
    border-radius:12px;padding:15px;font-size:1.05rem;font-weight:700;cursor:pointer;transition:.12s}
  .gate .names button:hover{border-color:var(--cyan);background:var(--card2)}
  .identbar{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--cyan);
    border-radius:12px;padding:11px 14px;margin-bottom:14px}
  .identbar .me{flex:1;font-weight:700;font-size:.95rem}
  .identbar .me small{display:block;font-weight:400;font-size:.74rem;color:var(--muted)}

  /* Case en cours d'enregistrement (orange) */
  .cell.pending{background:rgba(251,191,36,.22);border-color:var(--amber);cursor:default}
  .cell.pending .num{color:var(--amber)}
  .cell.pending .tag{color:var(--amber)}

  /* Popup date (v2.2) */
  .modal{position:fixed;inset:0;z-index:80;background:rgba(7,6,20,.72);backdrop-filter:blur(3px);
    display:none;align-items:flex-end;justify-content:center}
  .modal.show{display:flex}
  .sheet{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--cyan);
    border-radius:18px 18px 0 0;width:100%;max-width:520px;padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    box-shadow:0 -10px 40px rgba(0,0,0,.5)}
  @media(min-width:560px){.modal{align-items:center}.sheet{border-radius:18px}}
  .sheet h3{margin:0 0 2px;font-size:1.15rem;text-transform:capitalize}
  .sheet .stat{font-size:.85rem;margin:0 0 16px}
  .sheet .stat.free{color:var(--green)} .sheet .stat.r{color:var(--red)} .sheet .stat.m{color:var(--cyan)}
  .sheet textarea{width:100%;background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:10px;
    padding:11px;font-size:.95rem;font-family:inherit;resize:vertical;min-height:60px;margin-bottom:14px}
  .sheet .row{display:flex;gap:10px;flex-wrap:wrap}
  .sheet .row button,.sheet .row a{flex:1;min-width:120px;border:0;border-radius:11px;padding:14px;font-size:.98rem;font-weight:800;cursor:pointer;text-decoration:none;text-align:center;display:flex;align-items:center;justify-content:center}
  .b-go{background:var(--green);color:#04210f}
  .b-free{background:rgba(251,113,133,.16);color:var(--red);border:1px solid rgba(251,113,133,.5)!important}
  .b-close{background:var(--card2);color:var(--muted)}
  .sheet .popnote{background:var(--bg2);border:1px solid var(--amber);border-radius:10px;padding:10px 12px;margin:0 0 14px;color:var(--ink);font-size:.9rem;line-height:1.4;white-space:pre-wrap}
  .cell .tag.ocs{display:flex;flex-direction:column;gap:1px;width:100%}
  .cell .tag.ocs .oc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.56rem;line-height:1.1}
  /* 2 DJ (DUO) : séparation nette + badge */
  .cell.duo .tag.ocs .oc{font-weight:800}
  .cell.duo .tag.ocs .oc:first-child{border-bottom:2px solid rgba(255,255,255,.55);padding-bottom:1px;margin-bottom:1px}
  .cell.duo::after{content:"DUO";position:absolute;bottom:1px;right:3px;font-size:.46rem;font-weight:800;color:#fff;background:var(--red);border-radius:4px;padding:0 3px}
  /* DJ + invité : invité discret + badge */
  .cell.guest .tag.ocs .oc.inv{font-style:italic;opacity:.8;font-size:.52rem}
  .cell.guest::after{content:"+ invité";position:absolute;bottom:1px;right:3px;font-size:.46rem;font-weight:700;color:#04210f;background:var(--amber);border-radius:4px;padding:0 3px}
  .guestbox{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:.9rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .guestbox button{margin-left:auto}
  .poplbl{display:block;font-size:.82rem;color:var(--muted);font-weight:600;margin-bottom:12px}

onValue(ref(db, ".info/connected"), snap=>{

  el.classList.toggle("ok", ok); el.classList.toggle("off", !ok);

});

// ---- Auth (même connexion que Workspace) ----
onAuthStateChanged(auth, u=>{
  user = u;

  render();
});

// ---- Données ----
onValue(ref(db, ROOT), snap=>{
  const v = snap.val() || {};
  DATA.djs = v.djs || {}; DATA.dates = v.dates || {}; DATA.inscriptions = v.inscriptions || {};
  DATA.observations = v.observations || {}; DATA.obsGen = v.observation_generale || "";
  DATA.djOrder = Array.isArray(v.dj_order) ? v.dj_order : [];
  DATA.codes = v.codes || {};
  DATA.profiles = v.profiles || {};
  pending.clear();
  // Identification automatique via ?code=... dans le lien (une seule tentative)
  if(!urlCodeTried && urlCode){
    urlCodeTried = true;
    if(!myDjId || !DATA.djs[myDjId]){
      const found = Object.keys(DATA.codes).find(id=>DATA.djs[id] && String(DATA.codes[id]).trim().toLowerCase()===urlCode.toLowerCase());
      if(found){ myDjId=found; localStorage.setItem("agenda_artistes_me",myDjId);
        history.replaceState(null,"",location.pathname); }  // retire le code de la barre d'adresse
    }
  }
  render();
}, err=>{
  appEl.innerHTML = `<div class="empty"><div class="big">⚠️</div>Firebase refuse la lecture.<br>Vérifie que la règle <b>agenda_artistes</b> est publiée.<br><small style="opacity:.7">${esc(err.message)}</small></div>`;
});

// ---- Dates / utilitaires (toujours en local, jamais UTC) ----
function localDateStr(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const DOW=["lun","mar","mer","jeu","ven","sam","dim"];
const SOIREES=[5,6]; // vendredi, samedi
function estCreneau(dow){ return SOIREES.includes(dow); }
function djNom(id){ return DATA.djs[id] || "?"; }

// Modèle d'une date : dj (titulaire), guest (invité nom libre), dj2 (2e DJ posé par l'orga)
// Rétrocompatible avec les anciens formats (string, ou map {id:true})
function dateInfo(ymd){
  let v = DATA.inscriptions[ymd];
  if(typeof v === "string") v = {dj:v};
  else if(v && typeof v==="object" && !("dj" in v) && !("guest" in v) && !("dj2" in v)){
    const ks=Object.keys(v); v={dj:ks[0]||null, dj2:ks[1]||null};
  }
  v = v || {};
  return { dj:v.dj||null, guest:v.guest||null, dj2:v.dj2||null };
}
function datePrise(ymd){ return !!dateInfo(ymd).dj; }
function meSurDate(ymd){ const i=dateInfo(ymd); return i.dj===myDjId || i.dj2===myDjId; }
// Noms des occupants (avec "Toi" pour l'utilisateur, et marquage invité)
function occupants(ymd){
  const i=dateInfo(ymd), out=[];
  if(i.dj) out.push({label:i.dj===myDjId?"Toi":djNom(i.dj), me:i.dj===myDjId});
  if(i.guest) out.push({label:i.guest, invite:true});
  else if(i.dj2) out.push({label:i.dj2===myDjId?"Toi":djNom(i.dj2), me:i.dj2===myDjId});
  return out;
}

// Ordre d'affichage personnalisé des artistes (dj_order) — nouveaux ajoutés en fin
function orderedDjs(){
  const order = Array.isArray(DATA.djOrder) ? DATA.djOrder : [];
  const inOrder = order.filter(id=>DATA.djs[id]);
  const rest = Object.keys(DATA.djs).filter(id=>!inOrder.includes(id))
    .sort((a,b)=>DATA.djs[a].localeCompare(DATA.djs[b]));
  return [...inOrder, ...rest].map(id=>[id, DATA.djs[id]]);
}
function moveDj(id, dir){
  const ids = orderedDjs().map(([i])=>i);
  const idx = ids.indexOf(id), j = idx+dir;
  if(j<0 || j>=ids.length) return;
  [ids[idx],ids[j]]=[ids[j],ids[idx]];
  fbSet("dj_order", ids);
}
function dropReorder(dragId, targetId){
  if(dragId===targetId) return;
  let ids = orderedDjs().map(([i])=>i).filter(i=>i!==dragId);
  const ti = ids.indexOf(targetId);
  ids.splice(ti<0?ids.length:ti, 0, dragId);
  fbSet("dj_order", ids);
}
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

const JOURS=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
function fmtDateLong(ymd){ const [y,m,j]=ymd.split("-").map(Number); const d=new Date(y,m-1,j);
  return `${JOURS[d.getDay()]} ${j} ${MOIS[m-1]} ${y}`; }

let toastT;
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2400); }

async function fbSet(p,v){ try{ await set(ref(db,`${ROOT}/${p}`),v); }catch(e){ toast("Erreur réseau"); console.error(e);} }
async function fbRemove(p){ try{ await remove(ref(db,`${ROOT}/${p}`)); }catch(e){ toast("Erreur réseau"); console.error(e);} }

// ===================== RENDER =====================
function render(){
  if(profileView){ if(!document.getElementById("backProfile")) renderProfile(profileView); return; }
  viewMode==="admin" ? renderAdmin() : renderDj();
}

// ---------- Fiche technique d'un DJ ----------
function checks(field, opts, curMap){
  const cur = (curMap && typeof curMap==="object") ? curMap : (typeof curMap==="string" ? {[curMap]:true} : {});
  return `<span class="pills" data-checkfield="${field}">${opts.map(o=>{
    const lbl = o==="none" ? "Pas de sortie booth" : o;
    return `<button type="button" class="pill ${cur[o]?"on":""}" data-checkval="${o}">${lbl}</button>`;
  }).join("")}</span>`;
}
function renderProfile(djId){
  const p = DATA.profiles[djId] || {};
  const rane = !!p.rane;
  const files = p.files || {};
  let html = `<button class="ghost" id="backProfile">← Retour</button>
    <div class="sectit" style="margin-top:12px">🎛️ Fiche de ${esc(djNom(djId))}</div>`;

  html += `<div class="adminbox"><h3>🎚️ Équipement</h3>
    <label class="fl">Modèle de ton contrôleur
      <input id="p_controleur" ${rane?"disabled":""} value="${esc(p.controleur||"")}" placeholder="ex : Pioneer DDJ-1000"></label>
    <label class="ck" style="margin-top:12px"><input type="checkbox" id="p_rane" ${rane?"checked":""}>

function bindProfile(djId){
  const save=(champ,val)=>{ (val===""||val==null) ? fbRemove(`profiles/${djId}/${champ}`) : fbSet(`profiles/${djId}/${champ}`,val); };
  document.getElementById("backProfile").addEventListener("click",()=>{ profileView=null; render(); });
  const rane=document.getElementById("p_rane"), ctrl=document.getElementById("p_controleur");
  rane.addEventListener("change",()=>{ fbSet(`profiles/${djId}/rane`,rane.checked); ctrl.disabled=rane.checked; toast("Enregistré"); });
  ctrl.addEventListener("change",()=>{ save("controleur",ctrl.value.trim()); toast("Enregistré"); });
  // Multi-sélection (master / retour)
  appEl.querySelectorAll(".pills").forEach(g=>g.querySelectorAll(".pill").forEach(b=>b.addEventListener("click",()=>{
    b.classList.toggle("on");
    const field=g.dataset.checkfield, map={};
    g.querySelectorAll(".pill.on").forEach(x=>map[x.dataset.checkval]=true);
    Object.keys(map).length ? fbSet(`profiles/${djId}/${field}`,map) : fbRemove(`profiles/${djId}/${field}`);
    toast("Enregistré");
  })));
  [["p_mix","mix"],["p_reseaux","reseaux"],["p_visuels","visuels"],["p_obs","obs"]].forEach(([elid,champ])=>{
    const el=document.getElementById(elid);
    el.addEventListener("change",()=>{ save(champ,el.value.trim()); toast("Enregistré"); });
  });
  // Upload de fichiers (Firebase Storage)
  const fi=document.getElementById("p_files"), st=document.getElementById("upStatus");
  if(fi) fi.addEventListener("change",async()=>{
    const list=[...fi.files]; if(!list.length) return;
    for(const file of list){
      st.textContent=`Envoi de ${file.name}…`;
      try{
        const key="f_"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
        const r=sref(storage, `agenda_artistes/${djId}/${key}_${file.name}`);
        await uploadBytes(r, file);
        const url=await getDownloadURL(r);
        await fbSet(`profiles/${djId}/files/${key}`, {name:file.name, url, path:`agenda_artistes/${djId}/${key}_${file.name}`});
        st.textContent=`✅ ${file.name} ajouté`;
      }catch(e){ console.error(e); st.textContent=`⚠️ Échec de l'upload (${file.name}). Vérifie les règles Storage / le type de fichier.`; }
    }
    renderProfile(djId);   // rafraîchit la liste avec TOUS les fichiers
  });
  appEl.querySelectorAll("[data-delfile]").forEach(b=>b.addEventListener("click",async()=>{
    const k=b.dataset.delfile, f=(DATA.profiles[djId]&&DATA.profiles[djId].files||{})[k];
    try{ if(f&&f.path) await deleteObject(sref(storage,f.path)); }catch(e){ console.error(e); }
    await fbRemove(`profiles/${djId}/files/${k}`); toast("Fichier retiré"); renderProfile(djId);
  }));
  document.getElementById("saveProfile").addEventListener("click",()=>{
    // Tout est déjà sauvé en temps réel ; on force les champs texte au cas où et on rassure
    ["p_controleur","p_mix","p_reseaux","p_visuels","p_obs"].forEach(id=>{ const el=document.getElementById(id); if(el) el.dispatchEvent(new Event("change")); });
    toast("✅ Fiche enregistrée");
  });
}

// Construit la grille d'un mois (monthIdx 0-based, 2026)
function calHTML(monthIdx, mode){
  const first=new Date(2026,monthIdx,1);
  const offset=(first.getDay()+6)%7;               // colonne du 1er (lundi=0)
  const ndays=new Date(2026,monthIdx+1,0).getDate();
  let cells=`<div class="cal"><h2>${MOIS[monthIdx]}</h2><div class="calgrid">`;
  cells+=DOW.map(d=>`<div class="dow">${d}</div>`).join("");
  for(let i=0;i<offset;i++) cells+=`<div class="cell blank"></div>`;
  for(let day=1; day<=ndays; day++){
    const dObj=new Date(2026,monthIdx,day), ymd=localDateStr(dObj), dow=dObj.getDay();
    const creneau=estCreneau(dow), open=!!DATA.dates[ymd], occ=DATA.inscriptions[ymd];
    cells+=cellHTML(ymd, day, creneau, open, occ, mode);
  }
  cells+=`</div></div>`;
  return cells;
}

function cellHTML(ymd, day, creneau, open, occ, mode){
  const num=`<div class="num">${day}</div>`;
  const memo = DATA.observations[ymd] ? `<span class="memo" title="Remarque notée">📝</span>` : "";
  const info = dateInfo(ymd);
  const occs = occupants(ymd);
  const kind = (info.dj && info.dj2) ? "duo" : ((info.dj && info.guest) ? "guest" : "");
  const tagLines = occs.map(o=>`<span class="oc${o.invite?" inv":""}">${o.invite?"👤 ":""}${esc(o.label)}</span>`).join("");
  if(mode==="dj"){
    if(creneau && open){
      if(pending.has(ymd)) return `<div class="cell pending">${num}<div class="tag">⏳…</div></div>`;
      if(!occs.length) return `<div class="cell free" data-action="open" data-date="${ymd}">${num}${memo}<div class="tag g">Libre</div></div>`;
      const cls = meSurDate(ymd) ? "mine" : "taken";
      return `<div class="cell ${cls} ${kind}" data-action="open" data-date="${ymd}">${num}${memo}<div class="tag ${meSurDate(ymd)?"m":"r"} ocs">${tagLines}</div></div>`;
    }
    return `<div class="cell day">${num}</div>`;
  }
  // mode admin
  if(creneau){
    if(open){
      if(!occs.length) return `<div class="cell free" data-action="adm" data-date="${ymd}">${num}${memo}<div class="tag g">ouverte</div></div>`;
      return `<div class="cell taken ${kind}" data-action="adm" data-date="${ymd}">${num}${memo}<div class="tag r ocs">${tagLines}</div></div>`;
    }
    return `<div class="cell closed" data-action="adm" data-date="${ymd}">${num}<div class="tag x">fermée</div></div>`;
  }
  return `<div class="cell day">${num}</div>`;
}

// ---------- Popup d'une date ----------
function openDatePopup(ymd){
  const sheet=document.getElementById("sheet");
  const info = dateInfo(ymd);
  const occs = occupants(ymd);
  const jesuisTitulaire = info.dj===myDjId;
  const jesuis = meSurDate(ymd);
  const libre = !info.dj;
  const note = DATA.observations[ymd] ? `<p class="note popnote">📝 « ${esc(DATA.observations[ymd])} »</p>` : "";
  let body=`<h3>${fmtDateLong(ymd)}</h3>`;

  if(libre){
    body+=`<p class="stat free">✅ Date libre</p>${note}
      <div class="row"><button class="b-go" data-go="${ymd}">🎧 M'inscrire sur cette date</button></div>`;
  } else {
    // Récap des occupants
    body+=`<p class="stat ${jesuis?"m":"r"}">🎧 ${occs.map(o=>esc(o.label)+(o.invite?" (invité)":"")).join("  ·  ")}</p>`;
    body+=note;
    if(jesuisTitulaire){
      body+=`<label class="poplbl">Une remarque (style, matériel, horaire…)
        <textarea id="popObs" placeholder="Optionnel">${esc(DATA.observations[ymd]||"")}</textarea></label>`;
      // Gestion de l'invité
      if(info.dj2){
        body+=`<p class="note" style="margin:0 0 12px">Un 2ᵉ DJ est prévu par l'organisateur pour cette soirée.</p>`;
      } else if(info.guest){
        body+=`<div class="guestbox">👤 DJ invité : <b>${esc(info.guest)}</b>
          <button class="ghost danger" data-delguest="${ymd}">Retirer</button></div>`;
      } else {
        body+=`<label class="poplbl">Tu invites un binôme ? <span class="hint2">(optionnel)</span>
          <input id="guestName" placeholder="Nom du DJ invité" autocomplete="off" maxlength="40"></label>`;
      }
      body+=`<div class="row"><button class="b-free" data-free="${ymd}">Me désinscrire</button></div>`;
    } else if(info.dj2===myDjId){
      body+=`<div class="row"><button class="b-free" data-free2="${ymd}">Me retirer</button></div>`;
    }
    // sinon : pris par d'autres → lecture seule
  }
  body+=`<div class="row" style="margin-top:12px"><button class="b-validate" id="popClose">✓ Valider</button></div>`;
  sheet.innerHTML=body;
  document.getElementById("modal").classList.add("show");

  document.getElementById("popClose").addEventListener("click",()=>{
    const t=sheet.querySelector("#popObs");
    if(t){ const val=t.value.trim(); val ? fbSet(`observations/${ymd}`,val) : fbRemove(`observations/${ymd}`); }
    const g=sheet.querySelector("#guestName");
    if(g && g.value.trim()) fbSet(`inscriptions/${ymd}/guest`, g.value.trim());
    closePopup();
  });
  const go=sheet.querySelector("[data-go]");
  if(go) go.addEventListener("click",()=>{
    if(datePrise(ymd)){ toast("Trop tard, déjà prise !"); closePopup(); return; }
    pending.add(ymd); closePopup(); render();
    fbSet(`inscriptions/${ymd}/dj`, myDjId); toast("C'est noté 🎧");
  });
  const fr=sheet.querySelector("[data-free]");
  if(fr) fr.addEventListener("click",()=>{
    const i=dateInfo(ymd);
    pending.add(ymd); closePopup(); render();
    // le titulaire part : si un 2e DJ existe, il devient titulaire ; sinon la date se libère (invité inclus)
    if(i.dj2) fbSet(`inscriptions/${ymd}`, {dj:i.dj2});
    else fbRemove(`inscriptions/${ymd}`);
    toast("Désinscrit");
  });
  const fr2=sheet.querySelector("[data-free2]");
  if(fr2) fr2.addEventListener("click",()=>{
    pending.add(ymd); closePopup(); render();
    fbRemove(`inscriptions/${ymd}/dj2`); toast("Retiré");
  });
  const dg=sheet.querySelector("[data-delguest]");
  if(dg) dg.addEventListener("click",()=>{ fbRemove(`inscriptions/${ymd}/guest`); toast("Invité retiré"); closePopup(); });
  const gn=sheet.querySelector("#guestName");
  if(gn) gn.addEventListener("change",()=>{
    const n=gn.value.trim();
    n ? fbSet(`inscriptions/${ymd}/guest`,n) : fbRemove(`inscriptions/${ymd}/guest`);
    toast(n?"Invité enregistré 👤":"Invité retiré");
  });
  const obs=sheet.querySelector("#popObs");
  if(obs) obs.addEventListener("change",()=>{
    const val=obs.value.trim();
    val ? fbSet(`observations/${ymd}`,val) : fbRemove(`observations/${ymd}`);
    toast("Remarque enregistrée");
  });
}
function closePopup(){ document.getElementById("modal").classList.remove("show"); }
document.getElementById("modal").addEventListener("click",e=>{ if(e.target.id==="modal") closePopup(); });

    toast(id?`${djNom(id)} ajouté (2ᵉ DJ)`:"2ᵉ DJ retiré");
  }));
  appEl.querySelectorAll("[data-delguest]").forEach(b=>b.addEventListener("click",()=>{
    fbRemove(`inscriptions/${b.dataset.delguest}/guest`); toast("Invité retiré");
  }));
  // Code d'accès par artiste
  appEl.querySelectorAll("input[data-code]").forEach(t=>t.addEventListener("change",()=>{
    const id=t.dataset.code, val=t.value.trim();
    val ? fbSet(`codes/${id}`,val) : fbRemove(`codes/${id}`);
    toast("Code enregistré");
  }));
  // Réordonner les artistes : flèches
  appEl.querySelectorAll("[data-profile]").forEach(b=>b.addEventListener("click",()=>{ profileView=b.dataset.profile; render(); }));
  appEl.querySelectorAll("[data-link]").forEach(b=>b.addEventListener("click",()=>{
    const id=b.dataset.link, code=DATA.codes[id];
    const url=`https://i-immersion.github.io/agenda-artistes/?code=${encodeURIComponent(code)}`;
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(()=>toast(`Lien de ${djNom(id)} copié ✓`)).catch(()=>prompt("Copie ce lien :",url));
    } else { prompt("Copie ce lien :",url); }
  }));
  appEl.querySelectorAll("[data-up]").forEach(b=>b.addEventListener("click",()=>moveDj(b.dataset.up,-1)));
  appEl.querySelectorAll("[data-down]").forEach(b=>b.addEventListener("click",()=>moveDj(b.dataset.down,1)));
  // Réordonner les artistes : glisser-déposer (via la poignée)
  let dragId=null;
  appEl.querySelectorAll("#djlist .drag").forEach(h=>{
    h.addEventListener("dragstart",()=>{ const r=h.closest(".djrow"); dragId=r.dataset.id; r.classList.add("dragging"); });
    h.addEventListener("dragend",()=>appEl.querySelectorAll(".djrow").forEach(r=>r.classList.remove("dragging","over")));
  });
  appEl.querySelectorAll("#djlist .djrow").forEach(row=>{
    row.addEventListener("dragover",e=>{ e.preventDefault(); row.classList.add("over"); });
    row.addEventListener("dragleave",()=>row.classList.remove("over"));
    row.addEventListener("drop",e=>{ e.preventDefault(); row.classList.remove("over"); if(dragId) dropReorder(dragId, row.dataset.id); });
  });
  const add=document.getElementById("adddj");
  if(add) add.addEventListener("click",()=>{
    const inp=document.getElementById("newdj"); const nm=(inp.value||"").trim();
    if(!nm){ inp.focus(); return; }
    const id="dj_"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    fbSet(`djs/${id}`,nm); inp.value=""; toast(`${nm} ajouté`);
  });
  const inp=document.getElementById("newdj");
  if(inp) inp.addEventListener("keydown",e=>{ if(e.key==="Enter") document.getElementById("adddj").click(); });

  appEl.querySelectorAll("[data-action]").forEach(el=>el.addEventListener("click",()=>{
    const a=el.dataset.action;
    if(a==="deldj"){ const id=el.dataset.id;
      if(confirm(`Retirer ${djNom(id)} ? Ses dates réservées seront libérées.`)){
        for(const [d,occ] of Object.entries(DATA.inscriptions)) if(occ===id) fbRemove(`inscriptions/${d}`);
        fbRemove(`djs/${id}`);
      }
    } else if(a==="adm"){ const d=el.dataset.date;
      if(DATA.dates[d]){ // ouverte → fermer
        if(DATA.inscriptions[d] && !confirm("Date réservée. La fermer libérera l'artiste. Continuer ?")) return;
        fbRemove(`dates/${d}`); fbRemove(`inscriptions/${d}`);
      } else { fbSet(`dates/${d}`,true); } // fermée → ouvrir
    }
  }));
}

// ---- Bouton organisateur ----
document.getElementById("gear").addEventListener("click",()=>{
  viewMode = viewMode==="admin" ? "dj" : "admin";
  document.getElementById("gear").classList.toggle("on", viewMode==="admin");
  render();
});
</script>
</body>
</html>
