<style>
  :root{
    --bg:#0b0a1f; --bg2:#13112e; --card:#1a1840; --card2:#211f4d;
    --ink:#eae8ff; --muted:#9b97c8; --line:#2e2b5e;
    --violet:#8b5cf6; --cyan:#22d3ee; --green:#34d399; --red:#fb7185; --amber:#fbbf24;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(1200px 600px at 80% -10%,#241f5a 0%,transparent 55%),
               radial-gradient(900px 500px at -10% 10%,#1b2a52 0%,transparent 50%),var(--bg);
    color:var(--ink);min-height:100vh;padding:0 0 90px}
  header{position:sticky;top:0;z-index:20;background:rgba(11,10,31,.82);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);padding:14px 16px}
  .bar{display:flex;align-items:center;gap:12px;max-width:820px;margin:0 auto}
  .logo{width:34px;height:34px;flex:0 0 auto;border-radius:9px}
  h1{font-size:1.05rem;margin:0;line-height:1.1;letter-spacing:.3px}
  h1 small{display:block;font-size:.72rem;color:var(--muted);font-weight:400;letter-spacing:.4px}
  .ver{color:var(--violet);font-weight:600}
  .conn{display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--muted);margin-left:auto;white-space:nowrap}
  .conn .dotc{width:9px;height:9px;border-radius:50%;background:var(--muted);transition:.3s}
  .conn.ok .dotc{background:var(--green);box-shadow:0 0 8px rgba(52,211,153,.85)}
  .conn.off .dotc{background:var(--red);box-shadow:0 0 8px rgba(251,113,133,.7)}
  .gear{background:var(--card);border:1px solid var(--line);color:var(--muted);
    width:38px;height:38px;border-radius:10px;font-size:1.1rem;cursor:pointer;display:grid;place-items:center}
  .gear.on{color:var(--cyan);border-color:var(--cyan)}
  main{max-width:820px;margin:0 auto;padding:16px}

  .whois{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
  .whois label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:8px;letter-spacing:.4px;text-transform:uppercase}
  .whois select{width:100%;background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:13px 12px;font-size:1.05rem;font-weight:600}
  .whois .hint{margin-top:8px;font-size:.8rem;color:var(--muted)}

  .legend{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:4px 0 16px;font-size:.8rem;color:var(--muted)}
  .legend span{display:flex;align-items:center;gap:7px}
  .sw{width:14px;height:14px;border-radius:4px;border:1px solid}
  .sw.free{background:rgba(52,211,153,.2);border-color:var(--green)}
  .sw.taken{background:rgba(251,113,133,.18);border-color:var(--red)}
  .sw.mine{background:rgba(52,211,153,.2);border-color:var(--green);box-shadow:0 0 0 2px var(--cyan) inset}

  /* Calendrier */
  .cal{margin-bottom:24px}
  .cal h2{font-size:1.2rem;margin:0 0 10px 2px;text-transform:capitalize}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .dow{font-size:.62rem;color:var(--muted);text-align:center;padding-bottom:3px;text-transform:uppercase;letter-spacing:.3px}
  .cell{min-height:56px;border-radius:10px;padding:5px 4px;display:flex;flex-direction:column;gap:2px;
    background:var(--bg2);border:1px solid transparent;transition:.12s;overflow:hidden}
  .cell.blank{background:transparent}
  .cell .num{font-size:.74rem;font-weight:700;color:var(--muted)}
  .cell.day .num{color:var(--ink)}
  .cell.free{background:rgba(52,211,153,.16);border-color:rgba(52,211,153,.5);cursor:pointer}
  .cell.free .num{color:var(--green)}
  .cell.free:hover{background:rgba(52,211,153,.28)}
  .cell.taken{background:rgba(251,113,133,.14);border-color:rgba(251,113,133,.45)}
  .cell.taken .num{color:var(--red)}
  .cell.mine{background:rgba(52,211,153,.18);border:2px solid var(--cyan);cursor:pointer}
  .cell.mine .num{color:var(--green)}
  .cell.closed{background:var(--bg2);border:1px dashed var(--line);cursor:pointer}
  .cell.closed:hover{border-color:var(--violet)}
  .cell .tag{font-size:.58rem;line-height:1.05;font-weight:700;margin-top:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cell .tag.g{color:var(--green)} .cell .tag.r{color:var(--red)} .cell .tag.m{color:var(--cyan)} .cell .tag.x{color:var(--muted)}

  .empty{text-align:center;color:var(--muted);padding:48px 20px;font-size:.95rem;line-height:1.5}
  .empty .big{font-size:2rem;margin-bottom:10px}

  /* Login + Admin */
  .login{background:var(--card);border:1px solid var(--cyan);border-radius:14px;padding:18px;max-width:380px;margin:10px auto}
  .login h3{margin:0 0 4px;font-size:1rem;color:var(--cyan)}
  .login p{margin:0 0 14px;font-size:.82rem;color:var(--muted)}
  .login input{width:100%;background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:1rem;margin-bottom:10px}
  .login button{width:100%;background:var(--violet);color:#fff;border:0;border-radius:10px;padding:13px;font-weight:700;cursor:pointer;font-size:1rem}
  .login .err{color:var(--red);font-size:.82rem;margin-top:8px;min-height:1em}

  .adminbar{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:.85rem}
  .adminbar .who{flex:1;color:var(--cyan);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .adminbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:18px}
  .adminbox h3{margin:0 0 12px;font-size:.95rem;color:var(--cyan)}
  .djrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .djrow:last-child{border-bottom:0}
  .djrow .nm{flex:1;font-weight:600}
  .addrow{display:flex;gap:8px;margin-top:12px}
  .addrow input{flex:1;background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:1rem}
  button.act{background:var(--violet);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:7px 12px;cursor:pointer;font-size:.82rem}
  button.danger{color:var(--red);border-color:rgba(251,113,133,.4)}
  .note{font-size:.8rem;color:var(--muted);margin:0 2px 12px;line-height:1.4}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(40px);
    background:var(--card2);border:1px solid var(--cyan);color:var(--ink);padding:12px 20px;border-radius:12px;
    font-weight:600;opacity:0;transition:.25s;z-index:60;box-shadow:0 10px 40px rgba(0,0,0,.5);max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .loading{text-align:center;color:var(--muted);padding:60px 0}

  /* Observations + détails de dates (v2.1) */
  .obsgen{background:var(--card);border:1px solid var(--amber);border-radius:12px;padding:12px 14px;margin-bottom:14px}
  .obsgen .lbl{font-size:.72rem;color:var(--amber);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
  .obsgen .txt{font-size:.9rem;color:var(--ink);white-space:pre-wrap;line-height:1.4}
  textarea.obs{width:100%;background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:.88rem;font-family:inherit;resize:vertical;min-height:42px}
  .daterow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:11px 0;border-bottom:1px solid var(--line)}
  .daterow:last-child{border-bottom:0}
  .daterow .dd{font-weight:700;font-size:.92rem;flex:1;min-width:140px;text-transform:capitalize}
  .daterow .dd small{display:block;font-weight:400;font-size:.76rem;color:var(--muted)}
  .daterow .who2{font-size:.8rem;color:var(--cyan);font-weight:600}
  .daterow .who2.libre{color:var(--green)}
  .daterow textarea.obs{flex-basis:100%}
  .btn-ics{background:rgba(34,211,238,.14);color:var(--cyan);border:1px solid rgba(34,211,238,.45);border-radius:9px;padding:8px 12px;font-size:.8rem;font-weight:700;cursor:pointer;white-space:nowrap}
  .btn-ics:hover{background:rgba(34,211,238,.25)}
  .sendbar{position:sticky;bottom:0;margin:22px -16px -90px;padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg,var(--bg) 60%,transparent);}
  .btn-send{width:100%;max-width:520px;margin:0 auto;display:block;background:var(--violet);color:#fff;border:0;
    border-radius:12px;padding:15px;font-size:1rem;font-weight:800;cursor:pointer;box-shadow:0 6px 24px rgba(139,92,246,.4)}
  .btn-send:disabled{opacity:.4;cursor:default;box-shadow:none}
  .sectit{font-size:.95rem;margin:20px 2px 8px;color:var(--ink);font-weight:700}
</style>

<header>
  <div class="bar">
    <img class="logo" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MTIgNTEyIj48cmVjdCB3aWR0aD0iNTEyIiBoZWlnaHQ9IjUxMiIgcng9Ijk2IiBmaWxsPSIjMGIwYTFmIi8+PGNpcmNsZSBjeD0iMjU2IiBjeT0iMjU2IiByPSIxNTAiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzhiNWNmNiIgc3Ryb2tlLXdpZHRoPSIyMiIvPjxjaXJjbGUgY3g9IjI1NiIgY3k9IjI1NiIgcj0iNTQiIGZpbGw9IiMyMmQzZWUiLz48Y2lyY2xlIGN4PSIyNTYiIGN5PSIyNTYiIHI9IjIwIiBmaWxsPSIjMGIwYTFmIi8+PC9zdmc+" alt="">
    <h1>Soirées DJ<small>LUMIIA · Été 2026 · <span class="ver" id="ver">v…</span></small></h1>
    <span class="conn" id="conn" title="État de la connexion"><i class="dotc"></i><span id="connTxt">…</span></span>
    <button class="gear" id="gear" title="Espace organisateur">⚙</button>
  </div>
</header>

<main id="app"><div class="loading">Connexion à LUMIIA…</div></main>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBPgjVFKrP80qX_hlfUFqL168XONfNIBA4",
  authDomain: "lumiia-live.firebaseapp.com",
  databaseURL: "https://lumiia-live-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "lumiia-live",
  storageBucket: "lumiia-live.firebasestorage.app",
  messagingSenderId: "823919513931",
  appId: "1:823919513931:web:6f6f3c7c6d1699457b18ce"
};

const VERSION = "v2.1";
const ROOT = "agenda_artistes";

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

document.getElementById("ver").textContent = VERSION;

// État
let DATA = { djs:{}, dates:{}, inscriptions:{}, observations:{}, obsGen:"" };
let myDjId = localStorage.getItem("agenda_artistes_me") || "";
let viewMode = "dj";          // "dj" | "admin"
let user = null;              // utilisateur Firebase connecté
let loginErr = "";

const appEl = document.getElementById("app");

// ---- Voyant connexion (réseau Firebase réel) ----
onValue(ref(db, ".info/connected"), snap=>{
  const ok = snap.val() === true;
  const el = document.getElementById("conn");
  el.classList.toggle("ok", ok); el.classList.toggle("off", !ok);
  document.getElementById("connTxt").textContent = ok ? "connecté" : "hors ligne";
});

// ---- Auth (même connexion que Workspace) ----
onAuthStateChanged(auth, u=>{
  user = u;
  document.getElementById("gear").classList.toggle("on", viewMode==="admin");
  render();
});

// ---- Données ----
onValue(ref(db, ROOT), snap=>{
  const v = snap.val() || {};
  DATA.djs = v.djs || {}; DATA.dates = v.dates || {}; DATA.inscriptions = v.inscriptions || {};
  DATA.observations = v.observations || {}; DATA.obsGen = v.observation_generale || "";
  render();
}, err=>{
  appEl.innerHTML = `<div class="empty"><div class="big">⚠️</div>Firebase refuse la lecture.<br>Vérifie que la règle <b>agenda_artistes</b> est publiée.<br><small style="opacity:.7">${esc(err.message)}</small></div>`;
});

// ---- Dates / utilitaires (toujours en local, jamais UTC) ----
function localDateStr(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const DOW=["lun","mar","mer","jeu","ven","sam","dim"];
const SOIREES=[2,4,6]; // mardi, jeudi, samedi
function estCreneau(dow){ return SOIREES.includes(dow); }
function djNom(id){ return DATA.djs[id] || "?"; }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

const JOURS=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
function fmtDateLong(ymd){ const [y,m,j]=ymd.split("-").map(Number); const d=new Date(y,m-1,j);
  return `${JOURS[d.getDay()]} ${j} ${MOIS[m-1]} ${y}`; }

// ---- Export .ics (soirée 21h → 01h, lieu LUMIIA) ----
function buildICS(ymd, djId){
  const [y,m,j]=ymd.split("-").map(Number);
  const fin=new Date(y,m-1,j+1); // lendemain pour DTEND 01:00
  const f=d=>`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
  const stamp=new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
  const obs=(DATA.observations[ymd]||"").replace(/\n/g," ");
  return [
    "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//LUMIIA//Agenda Artistes//FR","CALSCALE:GREGORIAN",
    "BEGIN:VEVENT",
    `UID:agenda-artistes-${ymd}-${djId}@lumiia.fr`,
    `DTSTAMP:${stamp}`,
    `DTSTART:${f(new Date(y,m-1,j))}T210000`,
    `DTEND:${f(fin)}T010000`,
    `SUMMARY:Soirée DJ LUMIIA — ${djNom(djId)}`,
    `DESCRIPTION:${obs}`,
    "LOCATION:LUMIIA, 1 route de Fontagnal, 26400 Aouste-sur-Sye",
    "END:VEVENT","END:VCALENDAR"
  ].join("\r\n");
}
function downloadICS(ymd, djId){
  const blob=new Blob([buildICS(ymd,djId)],{type:"text/calendar;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=`lumiia-${ymd}.ics`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}

// ---- Mail récapitulatif (mailto prérempli) ----
function envoyerMail(){
  if(!myDjId){ toast("Choisis d'abord ton nom ☝"); return; }
  const mesDates=Object.entries(DATA.inscriptions).filter(([d,id])=>id===myDjId).map(([d])=>d).sort();
  if(!mesDates.length){ toast("Tu n'as encore réservé aucune date"); return; }
  const nom=djNom(myDjId);
  const lignes=mesDates.map(d=>{ const o=DATA.observations[d]; return "- "+fmtDateLong(d)+(o?` (${o})`:""); }).join("\n");
  const body=`Bonjour,\n\nVoici mes dates pour les soirées DJ LUMIIA :\n\n${lignes}\n\nArtiste : ${nom}\nAgenda en ligne : https://i-immersion.github.io/agenda-artistes/\n`;
  const subject=`Soirées DJ LUMIIA — dates de ${nom}`;
  location.href=`mailto:contact@lumiia.fr?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

let toastT;
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2400); }

async function fbSet(p,v){ try{ await set(ref(db,`${ROOT}/${p}`),v); }catch(e){ toast("Erreur réseau"); console.error(e);} }
async function fbRemove(p){ try{ await remove(ref(db,`${ROOT}/${p}`)); }catch(e){ toast("Erreur réseau"); console.error(e);} }

// ===================== RENDER =====================
function render(){ viewMode==="admin" ? renderAdmin() : renderDj(); }

// Construit la grille d'un mois (monthIdx 0-based, 2026)
function calHTML(monthIdx, mode){
  const first=new Date(2026,monthIdx,1);
  const offset=(first.getDay()+6)%7;               // colonne du 1er (lundi=0)
  const ndays=new Date(2026,monthIdx+1,0).getDate();
  let cells=`<div class="cal"><h2>${MOIS[monthIdx]}</h2><div class="calgrid">`;
  cells+=DOW.map(d=>`<div class="dow">${d}</div>`).join("");
  for(let i=0;i<offset;i++) cells+=`<div class="cell blank"></div>`;
  for(let day=1; day<=ndays; day++){
    const dObj=new Date(2026,monthIdx,day), ymd=localDateStr(dObj), dow=dObj.getDay();
    const creneau=estCreneau(dow), open=!!DATA.dates[ymd], occ=DATA.inscriptions[ymd];
    cells+=cellHTML(ymd, day, creneau, open, occ, mode);
  }
  cells+=`</div></div>`;
  return cells;
}

function cellHTML(ymd, day, creneau, open, occ, mode){
  const num=`<div class="num">${day}</div>`;
  if(mode==="dj"){
    if(creneau && open){
      if(occ){
        if(occ===myDjId) return `<div class="cell mine" data-action="liberer" data-date="${ymd}">${num}<div class="tag m">Toi 🎧</div></div>`;
        return `<div class="cell taken">${num}<div class="tag r">${esc(djNom(occ))}</div></div>`;
      }
      return `<div class="cell free" data-action="prendre" data-date="${ymd}">${num}<div class="tag g">Libre</div></div>`;
    }
    return `<div class="cell day">${num}</div>`;
  }
  // mode admin
  if(creneau){
    if(open){
      const tag = occ ? `<div class="tag r">${esc(djNom(occ))}</div>` : `<div class="tag g">ouverte</div>`;
      return `<div class="cell ${occ?"taken":"free"}" data-action="adm" data-date="${ymd}">${num}${tag}</div>`;
    }
    return `<div class="cell closed" data-action="adm" data-date="${ymd}">${num}<div class="tag x">fermée</div></div>`;
  }
  return `<div class="cell day">${num}</div>`;
}

// ---------- Vue DJ ----------
function renderDj(){
  const djOptions=Object.entries(DATA.djs).sort((a,b)=>a[1].localeCompare(b[1]));
  let html=`<div class="whois"><label>Je suis</label>
    <select id="meSelect"><option value="">— Choisis ton nom —</option>
    ${djOptions.map(([id,nm])=>`<option value="${id}" ${id===myDjId?"selected":""}>${esc(nm)}</option>`).join("")}</select>
    ${djOptions.length===0?`<div class="hint">Aucun artiste enregistré. L'organisateur les ajoute via ⚙.</div>`
      :`<div class="hint">Touche une case verte pour t'inscrire. Re-touche ta date (entourée) pour te désinscrire.</div>`}</div>`;
  html+=`<div class="legend">
    <span><i class="sw free"></i>Libre</span>
    <span><i class="sw taken"></i>Réservée</span>
    <span><i class="sw mine"></i>Ta date</span></div>`;

  if(DATA.obsGen) html+=`<div class="obsgen"><div class="lbl">📌 Infos organisateur</div><div class="txt">${esc(DATA.obsGen)}</div></div>`;

  const anyOpen=Object.keys(DATA.dates).length>0;
  if(!anyOpen){
    html+=`<div class="empty"><div class="big">🌙</div>Aucune soirée ouverte pour l'instant.<br>Reviens bientôt !</div>`;
  } else {
    html+=calHTML(6,"dj")+calHTML(7,"dj");
  }

  // Mes dates : .ics + observation, visible si l'artiste a des réservations
  const mesDates = myDjId ? Object.entries(DATA.inscriptions).filter(([d,id])=>id===myDjId).map(([d])=>d).sort() : [];
  if(mesDates.length){
    html+=`<div class="sectit">🎧 Mes dates</div><div class="adminbox" style="border-color:var(--cyan)">`;
    for(const d of mesDates){
      html+=`<div class="daterow">
        <span class="dd">${fmtDateLong(d)}</span>
        <button class="btn-ics" data-ics="${d}">📅 Mon agenda</button>
        <textarea class="obs" data-obs="${d}" placeholder="Une remarque sur cette date (style, matériel…)">${esc(DATA.observations[d]||"")}</textarea>
      </div>`;
    }
    html+=`</div>`;
  }

  if(myDjId){
    html+=`<div class="sendbar"><button class="btn-send" id="sendBtn" ${mesDates.length?"":"disabled"}>✉️ Enregistrer mes dates et envoyer</button></div>`;
  }

  appEl.innerHTML=html; bindDj();
}

function bindDj(){
  const sel=document.getElementById("meSelect");
  if(sel) sel.addEventListener("change",e=>{ myDjId=e.target.value; localStorage.setItem("agenda_artistes_me",myDjId); render(); });
  appEl.querySelectorAll(".cell[data-action]").forEach(el=>el.addEventListener("click",()=>{
    const date=el.dataset.date, a=el.dataset.action;
    if(!myDjId){ toast("Choisis d'abord ton nom en haut ☝"); return; }
    if(a==="prendre"){ if(DATA.inscriptions[date]){ toast("Trop tard, déjà prise !"); return; }
      fbSet(`inscriptions/${date}`,myDjId); toast("C'est noté 🎧"); }
    else if(a==="liberer"){ fbRemove(`inscriptions/${date}`); toast("Date libérée"); }
  }));
  appEl.querySelectorAll("[data-ics]").forEach(b=>b.addEventListener("click",()=>downloadICS(b.dataset.ics, DATA.inscriptions[b.dataset.ics]||myDjId)));
  appEl.querySelectorAll("textarea[data-obs]").forEach(t=>t.addEventListener("change",()=>{
    const d=t.dataset.obs, val=t.value.trim();
    val ? fbSet(`observations/${d}`,val) : fbRemove(`observations/${d}`);
    toast("Observation enregistrée");
  }));
  const sb=document.getElementById("sendBtn");
  if(sb) sb.addEventListener("click",envoyerMail);
}

// ---------- Vue Admin ----------
function renderAdmin(){
  if(!user){ renderLogin(); return; }
  const djOptions=Object.entries(DATA.djs).sort((a,b)=>a[1].localeCompare(b[1]));
  let html=`<div class="adminbar"><span class="who">🔓 ${esc(user.email)}</span>
    <button class="ghost" id="logout">Se déconnecter</button></div>`;

  html+=`<div class="adminbox"><h3>🎧 Artistes (${djOptions.length})</h3>
    ${djOptions.map(([id,nm])=>`<div class="djrow"><span class="nm">${esc(nm)}</span>
      <button class="ghost danger" data-action="deldj" data-id="${id}">Retirer</button></div>`).join("")||`<div class="note" style="margin:0">Aucun artiste pour l'instant.</div>`}
    <div class="addrow"><input id="newdj" placeholder="Nom de l'artiste" autocomplete="off">
      <button class="act" id="adddj">Ajouter</button></div></div>`;

  html+=`<div class="adminbox"><h3>📌 Observation générale (visible par les artistes)</h3>
    <textarea class="obs" id="obsGen" placeholder="Message affiché en haut pour tous les artistes (horaires, consignes…)">${esc(DATA.obsGen||"")}</textarea></div>`;

  html+=`<p class="note">📅 Touche une date (mardi · jeudi · samedi) pour l'<b>ouvrir</b> ou la <b>fermer</b> aux artistes. Vert = libre · Rouge = réservée (avec le nom).</p>`;
  html+=calHTML(6,"admin")+calHTML(7,"admin");

  // Détail des dates ouvertes : observation + .ics
  const ouvertes=Object.keys(DATA.dates).filter(d=>DATA.dates[d]).sort();
  if(ouvertes.length){
    html+=`<div class="sectit">🗒️ Dates ouvertes — observations & agenda</div><div class="adminbox">`;
    for(const d of ouvertes){
      const occ=DATA.inscriptions[d];
      html+=`<div class="daterow">
        <span class="dd">${fmtDateLong(d)}<small>${occ?"":"libre"}</small></span>
        <span class="who2 ${occ?"":"libre"}">${occ?esc(djNom(occ)):"—"}</span>
        ${occ?`<button class="btn-ics" data-ics="${d}">📅 .ics</button>`:""}
        <textarea class="obs" data-obs="${d}" placeholder="Observation sur cette date">${esc(DATA.observations[d]||"")}</textarea>
      </div>`;
    }
    html+=`</div>`;
  }

  appEl.innerHTML=html; bindAdmin();
}

function renderLogin(){
  appEl.innerHTML=`<div class="login">
    <h3>Espace organisateur</h3>
    <p>Connecte-toi avec tes identifiants LUMIIA (les mêmes que Workspace).</p>
    <input id="email" type="email" placeholder="email" value="contact@lumiia.fr" autocomplete="username">
    <input id="pwd" type="password" placeholder="mot de passe" autocomplete="current-password">
    <button id="dologin">Se connecter</button>
    <div class="err">${esc(loginErr)}</div>
  </div>`;
  const go=async()=>{
    loginErr="";
    const email=document.getElementById("email").value.trim();
    const pwd=document.getElementById("pwd").value;
    try{ await signInWithEmailAndPassword(auth,email,pwd); }    // onAuthStateChanged déclenchera le render
    catch(e){ loginErr="Connexion refusée — vérifie email et mot de passe."; renderLogin(); }
  };
  document.getElementById("dologin").addEventListener("click",go);
  document.getElementById("pwd").addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
}

function bindAdmin(){
  document.getElementById("logout").addEventListener("click",()=>signOut(auth));
  const og=document.getElementById("obsGen");
  if(og) og.addEventListener("change",()=>{
    const val=og.value.trim();
    val ? fbSet("observation_generale",val) : fbRemove("observation_generale");
    toast("Observation générale enregistrée");
  });
  appEl.querySelectorAll("[data-ics]").forEach(b=>b.addEventListener("click",()=>downloadICS(b.dataset.ics, DATA.inscriptions[b.dataset.ics])));
  appEl.querySelectorAll("textarea[data-obs]").forEach(t=>t.addEventListener("change",()=>{
    const d=t.dataset.obs, val=t.value.trim();
    val ? fbSet(`observations/${d}`,val) : fbRemove(`observations/${d}`);
    toast("Observation enregistrée");
  }));
  const add=document.getElementById("adddj");
  if(add) add.addEventListener("click",()=>{
    const inp=document.getElementById("newdj"); const nm=(inp.value||"").trim();
    if(!nm){ inp.focus(); return; }
    const id="dj_"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    fbSet(`djs/${id}`,nm); inp.value=""; toast(`${nm} ajouté`);
  });
  const inp=document.getElementById("newdj");
  if(inp) inp.addEventListener("keydown",e=>{ if(e.key==="Enter") document.getElementById("adddj").click(); });

  appEl.querySelectorAll("[data-action]").forEach(el=>el.addEventListener("click",()=>{
    const a=el.dataset.action;
    if(a==="deldj"){ const id=el.dataset.id;
      if(confirm(`Retirer ${djNom(id)} ? Ses dates réservées seront libérées.`)){
        for(const [d,occ] of Object.entries(DATA.inscriptions)) if(occ===id) fbRemove(`inscriptions/${d}`);
        fbRemove(`djs/${id}`);
      }
    } else if(a==="adm"){ const d=el.dataset.date;
      if(DATA.dates[d]){ // ouverte → fermer
        if(DATA.inscriptions[d] && !confirm("Date réservée. La fermer libérera l'artiste. Continuer ?")) return;
        fbRemove(`dates/${d}`); fbRemove(`inscriptions/${d}`);
      } else { fbSet(`dates/${d}`,true); } // fermée → ouvrir
    }
  }));
}

// ---- Bouton organisateur ----
document.getElementById("gear").addEventListener("click",()=>{
  viewMode = viewMode==="admin" ? "dj" : "admin";
  document.getElementById("gear").classList.toggle("on", viewMode==="admin");
  render();
});
</script>
